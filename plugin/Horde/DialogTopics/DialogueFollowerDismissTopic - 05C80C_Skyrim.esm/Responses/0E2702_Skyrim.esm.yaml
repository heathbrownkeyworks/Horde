    Values:
    - Language: English
      String: Such a shame. I thought we were getting along so well. I'll head back to Riften if you should have second thoughts.
    - Language: Spanish
      String: Qué lástima. Pensaba que nos llevábamos muy bien. Volveré a Riften por si te lo piensas mejor.
    - Language: Italian
      String: Questo è un peccato, andavamo d'accordo. Tornerò a Riften, se mai tu dovessi ripensarci.
    - Language: Chinese
      String: 真是遺憾。我以為我們能相處得很好。你要是改了主意我就回裂谷城。
    - Language: Polish
      String: Wielka szkoda. Myślałam, że dobrze się dogadujemy. Będę w Pękninie, jeśli zmienisz zdanie.
    - Language: Russian
      String: Какая жалость. Мне казалось, мы так хорошо ладим. Если вдруг передумаешь, я буду в Рифтене.
    - Language: French
      String: Quel dommage. Nous nous entendions si bien. Si vous changez d'avis, sachez que je retourne à Faillaise.
    - Language: Japanese
      String: 残念ね。私達とってもうまくやれてると思ってたんだけど。私はリフテンに戻るわ。気が変わったら来てちょうだい
    - Language: German
      String: Wie schade. Ich dachte, wir hätten uns so gut verstanden. Ich kehre nach Rifton zurück, falls Ihr es Euch anders überlegen solltet.
