  Text:
    TargetLanguage: English
    Values:
    - Language: English
      String: If that's what you want. Watch your back out there, and if you need me again, you know where I'll be.
    - Language: Spanish
      String: Si eso es lo que quieres. Ten cuidado ahí afuera y, si me necesitas de nuevo, ya sabes dónde encontrarme.
    - Language: Italian
      String: Se è quello che vuoi. Sta' in guardia là fuori, e se avrai ancora bisogno di me sai dove trovarmi.
    - Language: Chinese
      String: 如果那就是你想要的。你可要當心一點，如果你有什麼事需要我幫忙，你知道該去哪裡找我的。
    - Language: Polish
      String: Jeżeli tego chcesz. Uważaj na siebie. Wiesz, gdzie mnie znaleźć, jeśli znowu będę ci potrzebny.
    - Language: Russian
      String: Ну, если ты так хочешь... Береги себя, а если я тебе понадоблюсь - ты знаешь, где меня искать.
    - Language: French
      String: Si c'est ce que vous voulez. Faites bien attention à vous. Si vous avez encore besoin de moi, vous saurez où me trouver.
    - Language: Japanese
      String: お前がそういうなら。気をつけろよ。俺がまた必要になったら、俺の居場所は分かってるだろう
    - Language: German
      String: Wie Ihr wollt. Passt da draußen auf Euch auf. Und falls Ihr mich noch einmal benötigen solltet, wisst Ihr ja, wo Ihr mich finden könnt.
