    Values:
    - Language: English
      String: I understand. We must all follow our own paths. If you wish to find me again, I'll be in Nightcaller Temple.
    - Language: Spanish
      String: Lo entiendo. Todos tenemos que seguir nuestro propio camino. Si deseas volver a verme, estaré en el templo de la Visita Nocturna.
    - Language: Italian
      String: Capisco. Dobbiamo seguire ognuno la propria strada. Se avrai di nuovo bisogno di me, sono al Tempio di Nightcaller.
    - Language: Chinese
      String: 我明白。我們各有自己的道路要走。如果你又想要找我了，我在喚夜神殿等你。
    - Language: Polish
      String: Rozumiem. Każdy z nas podąża własną ścieżką. Jeśli zechcesz mnie odnaleźć ponownie, będę w Świątyni Nocnego Zewu.
    - Language: Russian
      String: Я понимаю. Каждый из нас идет своим путем. Если захочешь найти меня снова - я буду в храме Призывателей Ночи.
    - Language: French
      String: Je comprends. Chacun doit suivre son chemin. Si vous voulez me retrouver, je serai au Temple de Sorguevoix.
    - Language: Japanese
      String: 分かった。それぞれ自分の道を歩むべきだな。また会いたくなったら、ナイトコーラー聖堂に来てくれ
    - Language: German
      String: Ich verstehe. Wir alle müssen unserem eigenen Weg folgen. Wenn Ihr mich sucht, ich bin im Tempel des Nachtrufers.
