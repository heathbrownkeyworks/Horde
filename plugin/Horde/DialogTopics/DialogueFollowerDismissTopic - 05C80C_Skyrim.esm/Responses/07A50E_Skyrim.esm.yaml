  Text:
    TargetLanguage: English
    Values:
    - Language: English
      String: It is a lonely thing, facing all the dangers of Skyrim by yourself. Come and find me if you decide that you miss my companionship.
    - Language: Spanish
      String: Es una misión muy solitaria, enfrentarte a todos los peligros de Skyrim por tu cuenta. Ven a verme si echas de menos mi compañía.
    - Language: Italian
      String: Affrontare da soli tutti i pericoli di Skyrim non è cosa piacevole. Se ti renderai conto di rimpiangere la mia compagnia, vieni a cercarmi.
    - Language: Chinese
      String: 獨自面對天際裡的所有危險，是一件很孤獨的事情。要是你想念我們的友誼了，就來找我吧。
    - Language: Polish
      String: Trudno samotnie stawiać czoło niebezpieczeństwom czyhającym w Skyrim. Znajdź mnie, gdy zatęsknisz za moim towarzystwem.
    - Language: Russian
      String: Не очень весело противостоять всем опасностям Скайрима в одиночку. Найдешь меня, если решишь, что скучаешь по моей компании.
    - Language: French
      String: C'est une bien grande solitude que d'affronter les dangers de Bordeciel sans la moindre compagnie. Venez me trouver si ma présence vous manque.
    - Language: Japanese
      String: 寂しいわね、スカイリムの危機にたった1人で立ち向かうなんて。仲間が恋しくなったら、また訪ねてくるといいわ
    - Language: German
      String: Sich all den Gefahren in Himmelsrand allein stellen zu müssen, ist eine einsame Sache. Kommt zu mir, wenn Euch meine Gesellschaft fehlt.
